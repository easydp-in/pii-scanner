name: Release & Publish Artifacts

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: pii-scanner-linux-amd64
            asset_name: pii-scanner-linux-amd64
          - os: macos-latest
            artifact_name: pii-scanner-darwin-universal
            asset_name: pii-scanner-darwin-universal
          - os: windows-latest
            artifact_name: pii-scanner-windows-amd64.exe
            asset_name: pii-scanner-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install .

      - name: Compile Standalone Executable (PyInstaller)
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --console \
            --name "${{ matrix.artifact_name }}" \
            --clean \
            src/pii_scanner/cli.py

      - name: Ad-Hoc Sign Binary (macOS Apple Silicon & Intel)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep -s - dist/${{ matrix.artifact_name }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}

  publish-release:
    name: Publish GitHub Release & Checksums
    needs: [build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Binary Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Generate Cryptographic SHA256 Checksums
        run: |
          cd release_artifacts
          find . -type f -exec sha256sum {} + > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release_artifacts/**/*
            release_artifacts/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false

  publish-pypi:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Source and Wheel Distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/') && env.PYPI_API_TOKEN != ''
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/*
