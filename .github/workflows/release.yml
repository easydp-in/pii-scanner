name: Release & Publish Artifacts

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: easydp-scan-linux-amd64
            asset_name: easydp-scan-linux-amd64
          - os: macos-latest
            artifact_name: easydp-scan-macos-universal
            asset_name: easydp-scan-macos-universal
          - os: windows-latest
            artifact_name: easydp-scan-windows-amd64.exe
            asset_name: easydp-scan-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install .

      - name: Compile Standalone Executable (PyInstaller)
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --console \
            --name "${{ matrix.artifact_name }}" \
            --clean \
            src/pii_scanner/cli.py

      - name: Sign & Package macOS Launcher & App Bundle (Apple Silicon & Intel)
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/package-macos-app.sh
          ./scripts/package-macos-app.sh "${{ matrix.artifact_name }}"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/*
            !dist/EasyDP Scanner.app

  publish-release:
    name: Publish GitHub Release & Checksums
    needs: [build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Binary Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Generate Cryptographic SHA256 Checksums
        run: |
          cd release_artifacts
          find . -maxdepth 1 -type f ! -name "checksums.txt" -exec sha256sum {} + > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            release_artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false

  publish-pypi:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Source and Wheel Distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Publish to PyPI
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && secrets.PYPI_API_TOKEN != ''
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/*

  publish-npm:
    name: Build & Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && secrets.NPM_TOKEN != ''
        run: |
          cd npm-package
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
