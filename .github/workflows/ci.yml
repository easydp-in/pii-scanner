name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint Code with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Static Type Checking with Mypy
        run: |
          mypy src/

      - name: Run Test-Driven Test Suite (Unit, Integration, E2E)
        run: |
          pytest tests/unit tests/integration tests/e2e -v --cov=pii_scanner --cov-report=xml --cov-report=term-missing

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  test-installations:
    name: Verify Installation Methods (${{ matrix.os }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 1. Test Pip Installation & CLI Entrypoints
      - name: Test Standard Pip Install & Console Script
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          easydp-scan --version
          pii-scanner --version
          easydp-scan scan ./sample_data/ -f json,cli --output-dir ./test_pip_out -q

      # 2. Test NPM Package Wrapper
      - name: Test NPM Wrapper Package Installation
        run: |
          npm install -g ./npm-package
          easydp-scan --version
          node ./npm-package/bin/easydp-scan.js --version

      # 3. Test Shell Installer on Unix / macOS
      - name: Test Shell Installer (Linux & macOS)
        if: matrix.os != 'windows-latest'
        run: |
          bash scripts/install.sh
          ~/.local/bin/easydp-scan --version

      # 4. Test PowerShell Installer on Windows
      - name: Test PowerShell Installer Syntax (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput((Get-Content scripts/install.ps1 -Raw), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { throw $errors }

      # 5. Test PyInstaller Standalone Binary Generation & Execution
      - name: Test Standalone Binary Compilation
        shell: bash
        run: |
          python -m pip install pyinstaller
          pyinstaller --noconfirm --onefile --console --name "easydp-test-bin" src/pii_scanner/cli.py
          BIN="./dist/easydp-test-bin"
          if [ -f "./dist/easydp-test-bin.exe" ]; then
            BIN="./dist/easydp-test-bin.exe"
          fi
          "$BIN" --version
          "$BIN" scan ./sample_data/ -f json,cli --output-dir ./test_bin_out -q

