[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easydp-pii-scanner"
version = "0.2.4"
description = "Offline-first local PII scanner for Indian DPDP Act compliance built for SMBs by EasyDP.in"
readme = "README.md"
authors = [
    { name = "EasyDP", email = "support@easydp.in" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["pii", "dpdp", "privacy", "scanner", "compliance", "india", "aadhaar", "pan", "gstin", "tally"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "rich>=13.0.0",
    "openpyxl>=3.1.0",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
ai = [
    "gliner>=0.2.0",
    "protobuf>=3.20.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
]

[project.scripts]
easydp-scan = "pii_scanner.cli:main"
pii-scanner = "pii_scanner.cli:main"

[project.urls]
Homepage = "https://easydp.in"
Documentation = "https://github.com/easydp-in/pii-scanner#readme"
Repository = "https://github.com/easydp-in/pii-scanner"
Issues = "https://github.com/easydp-in/pii-scanner/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
